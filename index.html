<style>
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--ink:#12161B;--muted:#6B7280;--line:#E5E7EB;--line-strong:#CBD0D8;
  --a:#076AED;--a-soft:#DCE9FD;--b:#08BC84;--b-soft:#D6F5EA;--c:#6D28D9;--c-soft:#EBE3FB;
  --ok:#0A8F65;--ok-soft:#D6F5EA;--warn:#B45309;--warn-soft:#FEF3C7;--danger:#B91C1C;
  --radius:6px;--sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161B;--surface:#1B2027;--ink:#EDEFF2;--muted:#9AA1AC;--line:#2C3037;--line-strong:#3D424B;
  --a:#4D8DF5;--a-soft:#14294B;--b:#2ED3A0;--b-soft:#0F3B2E;--c:#A78BFA;--c-soft:#2A1E4A;
  --ok:#2ED3A0;--ok-soft:#0F3B2E;--warn:#FCD34D;--warn-soft:#3A2E0B;--danger:#F87171;}}
:root[data-theme="dark"]{
  --bg:#12161B;--surface:#1B2027;--ink:#EDEFF2;--muted:#9AA1AC;--line:#2C3037;--line-strong:#3D424B;
  --a:#4D8DF5;--a-soft:#14294B;--b:#2ED3A0;--b-soft:#0F3B2E;--c:#A78BFA;--c-soft:#2A1E4A;
  --ok:#2ED3A0;--ok-soft:#0F3B2E;--warn:#FCD34D;--warn-soft:#3A2E0B;--danger:#F87171;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px}h2{font-size:16px}h3{font-size:13px;color:var(--muted);font-weight:500}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{padding:4px 8px 18px}
.brand img{width:120px;height:auto;display:block;max-width:100%}
.nav a{display:block;padding:8px 10px;border-radius:var(--radius);text-decoration:none;color:var(--muted);margin-bottom:2px}
.nav a.on{background:var(--bg);color:var(--ink);font-weight:500}
.main{padding:28px 36px 60px;max-width:1160px;width:100%}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav a:focus-visible,.tabs button:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:4px}
.stat .d{margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--bg);color:var(--muted)}
.badge.active{background:var(--ok-soft);color:var(--ok)}.badge.paused{background:var(--warn-soft);color:var(--warn)}
.badge.scheduled{background:var(--c-soft);color:var(--c)}.badge.finished{background:var(--bg);color:var(--ink)}
.badge.connected{background:var(--ok-soft);color:var(--ok)}.badge.pending{background:var(--warn-soft);color:var(--warn)}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:600}
.tA{background:var(--a-soft);color:var(--a)}.tB{background:var(--b-soft);color:var(--b)}.tC{background:var(--c-soft);color:var(--c)}
label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px}
.field{margin-bottom:14px}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:8px 10px}
textarea{min-height:120px;resize:vertical}
.help{font-size:12px;color:var(--muted);margin-top:5px}
.err{font-size:12px;color:var(--danger);margin-top:5px}
.okmsg{font-size:12px;color:var(--ok);margin-top:5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.check input{margin-top:3px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td.n,th.n{text-align:right}
.tablewrap{overflow-x:auto}
.list a.item{display:grid;grid-template-columns:1fr auto;gap:14px;text-decoration:none;padding:16px 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.list a.item:hover{border-color:var(--line-strong)}
.split{height:10px;border-radius:99px;overflow:hidden;display:flex;background:var(--line)}
.split span{display:block;height:100%}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ink)}
.steps{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.steps div{padding:6px 10px;border-radius:var(--radius);font-size:12.5px;color:var(--muted);border:1px solid transparent}
.steps div.on{color:var(--ink);font-weight:500;background:var(--surface);border-color:var(--line)}
.steps div.done{color:var(--ink)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:visible}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.vs{display:grid;grid-template-columns:1fr 44px 1fr;gap:12px;align-items:stretch}
.vs .mid{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.vcard{border-top:3px solid;padding-top:14px}
.vcard.A{border-color:var(--a)}.vcard.B{border-color:var(--b)}.vcard.C{border-color:var(--c)}
.vcard .big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;margin:6px 0 2px}
.section{margin-top:26px}
.section>h2{margin-bottom:10px}
.chartbox{position:relative;height:220px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:10px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--radius);font-size:13px;z-index:60;max-width:90vw}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13.5px}
.kv b{font-weight:500;color:var(--muted)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:8px}
.pill-list span{display:inline-block;padding:3px 8px;border:1px solid var(--line);border-radius:4px;margin:0 6px 6px 0}
.note{background:var(--bg);border-radius:var(--radius);padding:10px 12px;font-size:12.5px}
pre{white-space:pre-wrap;margin:0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
  .brand{padding:0 8px 0 0}.brand img{width:70px}.nav{display:flex;gap:4px}
  .main{padding:18px 16px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  .vs{grid-template-columns:1fr}.vs .mid{display:none}
  .kv{grid-template-columns:1fr}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.progress i,.split span{transition:width .25s}}
</style>
</head>
<body>

<script>
/* ===================== configuração =====================
   Preencha com os dados do seu projeto Supabase (Project Settings → API).
   Se deixar vazio, o painel pede esses dados na primeira abertura e guarda no navegador. */
const SUPABASE_URL='https://yheiiacojiupcmttoqim.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZWlpYWNvaml1cGNtdHRvcWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODk3MzQsImV4cCI6MjEwNTc2NTczNH0.NRoIvqtRtqJ2qnFDV0jcxa4HAxJBSe9vP48fSf-qBA8';
const CNAME_TARGET='cname.vercel-dns.com';   // para onde o CNAME do cliente aponta (projeto Vercel que faz o redirect)

/* ===================== cliente ===================== */
const CFG=(()=>{try{return JSON.parse(localStorage.getItem('goat_cfg')||'null');}catch(e){return null;}})()||{};
const SB_URL=(SUPABASE_URL.startsWith('http')?SUPABASE_URL:CFG.url||'').replace(/\/$/,'');
const SB_KEY=SUPABASE_ANON_KEY.length>40?SUPABASE_ANON_KEY:(CFG.key||'');
let sb=null;
if(SB_URL&&SB_KEY&&window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY);
let USER=null;let WSS=[];let WS=null;   // espaços de trabalho (o próprio + convites) e o espaço aberto
const PERMS=[['create','Criar testes'],['edit','Editar, pausar, encerrar e zerar testes'],['delete','Excluir testes'],['domains','Gerenciar domínios']];
function can(perm){if(!WS)return false;if(WS.role==='owner'||WS.role==='admin')return true;return !!(WS.permissions||{})[perm];}
const isAdmin=()=>WS&&(WS.role==='owner'||WS.role==='admin');

/* ===================== estado (cache do banco) ===================== */
let S={domains:[],experiments:[]};   // configuração
let R={};                            // agregados por teste: {per:{variant_id:{visitors,clicks,count,sum}},daily:{},events:[],unattributed,events_total}
const uid=(p='')=>p+Math.random().toString(36).slice(2,10);
const now=()=>Date.now();
const DAY=86400000;
const ms=s=>s?Date.parse(s):null;
const iso=t=>new Date(t).toISOString();
const TYPES={capture:'Página de captura',sales:'Página de vendas',checkout:'Página de checkout'};
const STATUS={active:'Em andamento',paused:'Pausado',scheduled:'Agendado',finished:'Encerrado'};
const AGG={count:'Contar eventos',sum:'Somar o campo de valor',avg:'Média do campo de valor (ticket médio)',rate:'Porcentagem de visitantes que geraram o evento'};
const LETTER=i=>String.fromCharCode(65+i);
const VCLASS=i=>['A','B','C'][Math.min(i,2)];

/* ===================== utilidades ===================== */
const fmtN=n=>Number(n||0).toLocaleString('pt-BR');
const fmtP=n=>(Number(n||0)).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const fmtR=n=>'R$'+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtD=t=>new Date(t).toLocaleDateString('pt-BR');
const fmtDT=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function slugify(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);}
function slugFree(slug,domainId,ignoreId){return !S.experiments.some(e=>e.slug===slug&&(e.domain_id||'')===(domainId||'')&&e.id!==ignoreId);}
function toast(m){const t=document.getElementById('toast');t.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(t._t);t._t=setTimeout(()=>t.innerHTML='',3500);}
function copy(text){navigator.clipboard?.writeText(text).then(()=>toast('Copiado'),()=>toast(text));}
const domainOf=e=>S.domains.find(d=>d.id===e.domain_id);
const defaultLink=slug=>SB_URL+'/functions/v1/redirect/'+slug;
const linkOf=e=>{const d=domainOf(e);return d?'https://'+d.host+'/'+e.slug:defaultLink(e.slug);};
/* Link provisório: passa pela função direto, sem depender do DNS do domínio. Útil para testar antes da propagação. */
const tempLinkOf=e=>{const d=domainOf(e);return d?defaultLink(e.slug)+'?host='+encodeURIComponent(d.host):defaultLink(e.slug);};
const webhookUrl=t=>SB_URL+'/functions/v1/webhook/'+t;
function localDate(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function localISO(t){const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}
function fmtPrim(e,v){const a=e.metric.aggregation;return a==='sum'||a==='avg'?fmtR(v):a==='rate'?fmtP(v):fmtN(v);}
function primLabel(e){const m=e.metric;return{count:'quantidade de eventos',sum:'valor total de '+m.value_field,avg:'ticket médio de '+m.value_field,rate:'% de visitantes com '+m.event_value}[m.aggregation]||'resultado';}
function deepGet(o,k){if(o==null||typeof o!=='object')return undefined;if(k in o)return o[k];for(const v of Object.values(o)){const r=deepGet(v,k);if(r!==undefined)return r;}return undefined;}
function flatKeys(o){if(o==null||typeof o!=='object'||Array.isArray(o))return[];return Object.entries(o).flatMap(([k,v])=>v&&typeof v==='object'&&!Array.isArray(v)?[...flatKeys(v)]:[k]);}
function qualifies(m,p){return(!m.event_field||String(deepGet(p,m.event_field)??'')===String(m.event_value??''))&&(!m.status_field||String(deepGet(p,m.status_field)??'')===String(m.status_value??''));}
function fail(err,ctx){console.error(ctx,err);toast((ctx?ctx+': ':'')+(err?.message||err));}

/* ===================== carregamento ===================== */
function mapExp(row){
  const mc=(Array.isArray(row.metric_configurations)?row.metric_configurations[0]:row.metric_configurations)||{};
  return{id:row.id,name:row.name,type:row.type,status:row.status,draft:!!row.draft,archived:!!row.archived,domain_id:row.domain_id||'',slug:row.slug,start_at:ms(row.start_at),end_at:ms(row.end_at),auto_winner:!!row.auto_winner,
    winning_variant_id:row.winning_variant_id,webhook_token:row.webhook_token,created_at:ms(row.created_at),finished_at:ms(row.finished_at),
    sample_payload:row.sample_payload||null,webhook_fields:row.webhook_fields||(row.sample_payload?flatKeys(row.sample_payload):[]),
    metric:{event_field:mc.event_field||'',event_value:mc.event_value||'',status_field:mc.status_field||'',status_value:mc.status_value||'',value_field:mc.value_field||'',aggregation:mc.aggregation_type||'count',id_field:'ab_click_id'},
    variants:(row.variants||[]).slice().sort((a,b)=>a.position-b.position).map(v=>({id:v.id,name:v.name,url:v.url,pct:Number(v.traffic_percentage),position:v.position})),
    history:(row.experiment_history||[]).map(h=>({at:ms(h.created_at),msg:h.details?.msg||({created:'Teste criado',auto_finished:'Teste encerrado automaticamente na data de término',auto_winner:'Versão campeã definida automaticamente',webhook_received:'Webhook recebido',metrics_reset:'Métricas zeradas'})[h.action]||h.action})).sort((a,b)=>a.at-b.at)};
}
async function loadAll(){
  const {data:ws}=await sb.rpc('my_workspaces');WSS=(ws||[]).map(w=>({owner_id:w.owner_id,email:w.owner_email,role:w.role,permissions:w.permissions||{}}));
  const saved=localStorage.getItem('goat_ws');WS=WSS.find(w=>w.owner_id===saved)||WSS.find(w=>w.role==='owner')||WSS[0]||{owner_id:USER.id,email:'',role:'owner',permissions:{}};
  const [d,e,vr]=await Promise.all([
    sb.from('domains').select('*').order('created_at'),
    sb.from('experiments').select('*,variants!experiment_id(*),metric_configurations(*),experiment_history(*)').order('created_at',{ascending:false}),
    sb.from('variant_results').select('*')]);
  if(d.error)throw d.error;if(e.error)throw e.error;if(vr.error)throw vr.error;
  S.domains=d.data.filter(x=>x.user_id===WS.owner_id).map(x=>({id:x.id,host:x.host,status:x.status,verified_at:ms(x.verified_at),created_at:ms(x.created_at),last_check:x.last_check_message?('Última verificação '+fmtDT(ms(x.last_checked_at)||now())+': '+x.last_check_message):''}));
  S.experiments=e.data.filter(x=>x.user_id===WS.owner_id).map(mapExp);
  vr.data.forEach(r=>{const a=R[r.experiment_id]=R[r.experiment_id]||{per:{},daily:null,events:[],unattributed:0,events_total:0};a.per[r.variant_id]={visitors:Number(r.visitors),clicks:Number(r.clicks),count:Number(r.results),sum:Number(r.value)};});
}
async function loadExp(id){
  const [vr,dh,ev,un,tot]=await Promise.all([
    sb.from('variant_results').select('*').eq('experiment_id',id),
    sb.from('daily_history').select('*').eq('experiment_id',id),
    sb.from('webhook_events').select('*').eq('experiment_id',id).order('created_at',{ascending:false}).limit(50),
    sb.from('webhook_events').select('id',{count:'exact',head:true}).eq('experiment_id',id).eq('attributed',false),
    sb.from('webhook_events').select('id',{count:'exact',head:true}).eq('experiment_id',id)]);
  const a=R[id]={per:{},daily:{},events:[],unattributed:un.count||0,events_total:tot.count||0};
  (vr.data||[]).forEach(r=>a.per[r.variant_id]={visitors:Number(r.visitors),clicks:Number(r.clicks),count:Number(r.results),sum:Number(r.value)});
  (dh.data||[]).forEach(r=>{const k=dayKey(ms(r.day));a.daily[k]=a.daily[k]||{};a.daily[k][r.variant_id]={visitors:Number(r.visitors),count:Number(r.results),sum:Number(r.value)};});
  a.events=(ev.data||[]).map(x=>({...x,created_at:ms(x.created_at)}));
}
async function refreshExp(id){const e=S.experiments.find(x=>x.id===id);if(!e)return;
  const {data}=await sb.from('experiments').select('*,variants!experiment_id(*),metric_configurations(*),experiment_history(*)').eq('id',id).maybeSingle();
  if(data)S.experiments[S.experiments.indexOf(e)]=mapExp(data);await loadExp(id);}

/* ===================== regras do experimento (só leitura; a lógica de distribuição roda no servidor) ===================== */
function displayStatus(e){if(e.status==='finished')return'finished';if(e.status==='paused')return'paused';if(e.start_at>now())return'scheduled';return'active';}
function endAt(e){return e.end_at||null;}
async function hist(e,msg){await sb.from('experiment_history').insert({experiment_id:e.id,action:'note',details:{msg}});}
function computeResults(e){
  const a=R[e.id]||{per:{},unattributed:0,events_total:0};const m=e.metric;const per={};
  e.variants.forEach(v=>{const x=a.per[v.id]||{visitors:0,clicks:0,count:0,sum:0};per[v.id]={...x};});
  const tv=e.variants.reduce((s,v)=>s+per[v.id].visitors,0),cl=e.variants.reduce((s,v)=>s+per[v.id].clicks,0);
  e.variants.forEach(v=>{const p=per[v.id];p.share=tv?p.visitors/tv*100:0;p.conv=p.visitors?p.count/p.visitors*100:0;p.avg=p.count?p.sum/p.count:0;p.primary={count:p.count,sum:p.sum,avg:p.avg,rate:p.conv}[m.aggregation]??p.count;});
  return{per,visitors:tv,clicks:cl,unattributed:a.unattributed,events:a.events_total};
}
function dailySeries(e){const a=R[e.id]||{};const src=a.daily||{};const days={};
  Object.keys(src).sort().forEach(k=>{days[k]={};e.variants.forEach(v=>days[k][v.id]=src[k][v.id]||{visitors:0,count:0,sum:0});});
  return{keys:Object.keys(days),days};}

}
function varHTML(v,i){return`<div class="card" style="padding:14px;margin-bottom:10px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="tag t${VCLASS(i)}">Versão ${LETTER(i)}</span>${i>1?`<button class="btn sm" onclick="W.variants.splice(${i},1);equalize();renderWizard(document.getElementById('main'),W.edit)">Remover</button>`:''}</div>
  <div class="grid" style="grid-template-columns:1fr 2fr 110px"><div class="field"><label>Nome</label><input type="text" value="${esc(v.name)}" placeholder="${i===0?'Greenn':i===1?'Hotmart':'Versão '+LETTER(i)}" oninput="W.variants[${i}].name=this.value"></div>
  <div class="field"><label>URL</label><input type="url" value="${esc(v.url)}" placeholder="https://" oninput="W.variants[${i}].url=this.value.trim()"></div>
  <div class="field"><label>Tráfego</label><div class="row" style="flex-wrap:nowrap"><input type="number" min="0" max="100" step="1" value="${v.pct}" oninput="W.variants[${i}].pct=Number(this.value)||0;updateSplitBar()"><span class="muted">%</span></div></div></div></div>`;}
function equalize(){const n=W.variants.length;const base=Math.floor(100/n);W.variants.forEach((v,i)=>v.pct=base+(i<100-base*n?1:0));}
function updateSlugPreview(){const d=S.domains.find(x=>x.id===W.domain_id);const inp=document.getElementById('w-slug');if(!inp)return;if(!W.slugTouched){W.slug=slugify(W.name);inp.value=W.slug;}
  const free=W.slug&&slugFree(W.slug,W.domain_id,W.exp_id);
  document.getElementById('w-slug-msg').innerHTML=!W.slug?`<div class="err">Informe um slug.</div>`:free?`<div class="okmsg">Slug disponível</div>`:`<div class="err">Esse slug já está em uso neste domínio.</div>`;
  document.getElementById('w-preview').textContent=d?`https://${d.host}/${W.slug||''}`:defaultLink(W.slug||'');}
function updateSplitBar(){const el=document.getElementById('w-split');if(!el)return;const tot=W.variants.reduce((a,v)=>a+v.pct,0);
  el.innerHTML=W.variants.map((v,i)=>`<span style="width:${Math.max(0,Math.min(100,v.pct))}%;background:var(--${VCLASS(i).toLowerCase()})"></span>`).join('');
  document.getElementById('w-split-lbl').innerHTML=`<span>${W.variants.map((v,i)=>`<span class="tag t${VCLASS(i)}">${LETTER(i)}</span> ${v.pct}% `).join(' ')}</span><span class="${tot===100?'okmsg':'err'}" style="margin:0">Soma: ${tot}%</span>`;}

/* O teste é gravado como rascunho ao chegar na etapa do webhook: o endereço precisa existir no servidor para receber a carga. */
async function saveDraft(){
  const base={user_id:WS.owner_id,name:W.name.trim(),type:W.type,domain_id:W.domain_id||null,slug:W.slug,start_at:iso(W.startMode==='now'&&!W.edit?now():W.start),end_at:W.end?iso(W.end):null,auto_winner:!!W.end&&W.auto_winner,primary_metric:W.metric.aggregation};
  if(!W.exp_id){const {data,error}=await sb.from('experiments').insert({...base,draft:true}).select().single();if(error)throw error;W.exp_id=data.id;W.webhook_token=data.webhook_token;}
  else{const {error}=await sb.from('experiments').update(base).eq('id',W.exp_id);if(error)throw error;}
  await syncVariants();
}
async function syncVariants(){
  const {data:existing}=await sb.from('variants').select('id').eq('experiment_id',W.exp_id);const keep=new Set();
  for(let i=0;i<W.variants.length;i++){const v=W.variants[i];const row={experiment_id:W.exp_id,name:v.name.trim(),url:v.url,traffic_percentage:v.pct,position:i};
    if(String(v.id).startsWith('new_')){const {data,error}=await sb.from('variants').insert(row).select().single();if(error)throw error;v.id=data.id;}
    else{const {error}=await sb.from('variants').update(row).eq('id',v.id);if(error)throw error;}
    keep.add(v.id);}
  for(const r of existing||[])if(!keep.has(r.id))await sb.from('variants').delete().eq('id',r.id);
}
/* A etapa 4 fica consultando webhook_events do rascunho: só libera quando algo chegou de fato */
setInterval(async()=>{if(!sb||!W||W.step!==3||W.test_payload||!W.exp_id)return;
  const {data}=await sb.from('webhook_events').select('payload').eq('experiment_id',W.exp_id).order('created_at',{ascending:false}).limit(1);
  if(data&&data[0]&&W&&W.step===3)wizGotPayload(data[0].payload);},2000);
function wizGotPayload(p){
  W.test_payload=p;W.fields=flatKeys(p);prefillRules(W.metric,W.fields,p,W.type);
  toast('Carga de teste recebida pelo webhook');renderWizard(document.getElementById('main'),W.edit);}
function prefillRules(m,F,p,type){
  const pick=list=>list.find(k=>F.includes(k))||'';const v=k=>String(deepGet(p,k)??'');
  if(!m.event_field)m.event_field=pick(['event','evento','event_type','type','trigger','hook_action','webhook_type','action']);
  if(m.event_field&&!m.event_value)m.event_value=v(m.event_field);
  if(type==='capture'){
    if(!m.aggregation||m.aggregation==='sum')m.aggregation='count';m.value_field=m.value_field||'';
    if(!m.status_field){m.status_field='';m.status_value='';}
  }else{
    if(!m.value_field)m.value_field=pick(['amount','value','price','valor','total','full_price','net_amount','purchase_amount']);
    if(!m.aggregation||m.aggregation==='count')m.aggregation=m.value_field?'sum':'count';
    if(!m.status_field){m.status_field=['status','purchase_status','sale_status','payment_status'].find(k=>F.includes(k)&&k!==m.event_field)||'';if(m.status_field)m.status_value=v(m.status_field);}
  }
  m.id_field='ab_click_id';
}
function metricPreview(){const el=document.getElementById('w-metric-preview');if(!el)return;const m=W.metric;
  const what={count:'contar quantos eventos',sum:`somar <span class="mono">${esc(m.value_field||'?')}</span> dos eventos`,avg:`tirar a média de <span class="mono">${esc(m.value_field||'?')}</span> por evento`,rate:'calcular a % de visitantes de cada versão que geraram um evento'}[m.aggregation];
  el.innerHTML=`<strong>Regra:</strong> para cada versão, ${what} sempre que <span class="mono">${esc(m.event_field||'?')}</span> for <span class="mono">${esc(m.event_value||'?')}</span>${m.status_field?` e <span class="mono">${esc(m.status_field)}</span> for <span class="mono">${esc(m.status_value)}</span>`:''}. Ligado à versão por <span class="mono">ab_click_id</span>.`;}
function wizValidate(s){
  if(s===0){if(!W.name.trim())return'Dê um nome ao teste.';if(!W.type)return'Escolha o tipo de página.';if(W.startMode==='date'&&!W.start)return'Escolha a data de início.';if(W.startMode==='date'&&W.start<now()-60000&&!(W.edit&&W.start===W.origStart))return'A data de início não pode ser no passado.';if(W.end&&W.end<=W.start)return'A data de término precisa ser depois do início.';}
  if(s===1){if(W.variants.length<2)return'Adicione pelo menos duas versões.';for(const v of W.variants){if(!v.name.trim())return'Toda versão precisa de nome.';try{const u=new URL(v.url);if(!/^https?:$/.test(u.protocol))throw 0;}catch(e){return`A URL da versão "${v.name||'?'}" precisa começar com http:// ou https://.`;}}
    const norm=u=>u.replace(/\/+$/,'').toLowerCase();const urls=W.variants.map(v=>norm(v.url));if(new Set(urls).size!==urls.length)return'As versões precisam ter URLs diferentes.';
    if(W.variants.reduce((a,v)=>a+v.pct,0)!==100)return'A distribuição precisa somar 100%.';}
  if(s===2){if(!W.slug)return'Informe um slug.';if(!slugFree(W.slug,W.domain_id,W.exp_id))return'Esse slug já está em uso neste domínio.';}
  if(s===3){if(!W.test_payload)return'Nenhuma carga de teste chegou ao webhook ainda.';}
  if(s===4){if(!W.metric.event_field)return'Escolha o campo que identifica o evento.';if(!W.metric.event_value)return'Informe o valor do evento.';if(W.metric.status_field&&!W.metric.status_value)return'Informe o valor da segunda condição.';if((W.metric.aggregation==='sum'||W.metric.aggregation==='avg')&&!W.metric.value_field)return'Para somar ou tirar média, escolha o campo de valor.';}
  return null;
}
async function wizNext(){const err=wizValidate(W.step);if(err){document.getElementById('w-err').textContent=err;return;}if(W.step===0&&!W.slugTouched)W.slug=slugify(W.name);
  if(W.step===2){const b=document.getElementById('w-next');b.disabled=true;b.textContent='Salvando…';try{await saveDraft();}catch(e){if(String(e.code)==='23505'){W.step=2;renderWizard(document.getElementById('main'),W.edit);document.getElementById('w-err').textContent='Esse slug já está em uso no link padrão. Escolha outro.';return;}fail(e,'Não foi possível gravar o teste');b.disabled=false;b.textContent='Continuar';return;}}
  W.step++;renderWizard(document.getElementById('main'),W.edit);}
function wizPrev(){W.step--;renderWizard(document.getElementById('main'),W.edit);}
async function wizFinish(){
  for(let i=0;i<5;i++){const err=wizValidate(i);if(err){W.step=i;renderWizard(document.getElementById('main'),W.edit);document.getElementById('w-err').textContent=err;return;}}
  const b=document.getElementById('w-finish');b.disabled=true;b.textContent='Salvando…';
  try{
    if(!W.end)W.auto_winner=false;
    await saveDraft();const m=W.metric;
    const {error:e1}=await sb.from('experiments').update({draft:false,sample_payload:W.test_payload,webhook_fields:W.fields}).eq('id',W.exp_id);if(e1)throw e1;
    const {error:e2}=await sb.from('metric_configurations').upsert({experiment_id:W.exp_id,event_field:m.event_field,event_value:m.event_value,status_field:m.status_field||null,status_value:m.status_value||null,value_field:m.value_field||null,id_field:m.id_field||'ab_click_id',aggregation_type:m.aggregation,updated_at:iso(now())},{onConflict:'experiment_id'});if(e2)throw e2;
    await sb.from('experiment_history').insert({experiment_id:W.exp_id,action:'note',details:{msg:W.edit?'Teste editado':'Teste criado'}});
    const id=W.exp_id;W=null;await boot();toast(W?'':'Teste salvo');go('#/teste/'+id);
  }catch(e){fail(e,'Não foi possível salvar');b.disabled=false;b.textContent='Tentar de novo';}
}

function tabWebhook(e,r){const isVal=k=>k==='event_value'||k==='status_value';const fields=e.webhook_fields||[];

function lastClickId(e){const ev=(R[e.id]?.events||[]).find(x=>x.click_id);return ev?ev.click_id:null;}
let pendingMetric={};
function setMetric(id,k,v){(pendingMetric[id]=pendingMetric[id]||{})[k]=v;}
async function applyMetric(id){const e=S.experiments.find(x=>x.id===id);const m={...e.metric,...(pendingMetric[id]||{})};pendingMetric[id]={};
  const {error}=await sb.from('metric_configurations').upsert({experiment_id:id,event_field:m.event_field,event_value:m.event_value,status_field:m.status_field||null,status_value:m.status_value||null,value_field:m.value_field||null,id_field:m.id_field||'ab_click_id',aggregation_type:m.aggregation,updated_at:iso(now())},{onConflict:'experiment_id'});
  if(error)return fail(error,'Não foi possível salvar');await sb.from('experiments').update({primary_metric:m.aggregation}).eq('id',id);await hist(e,'Métrica principal alterada');await refreshExp(id);toast('Métrica atualizada');render();}
function eventsTable(e){const m=e.metric;const ev=(R[e.id]?.events||[]);const V=e.variants;if(!ev.length)return`<div class="empty">Nenhum evento recebido.</div>`;
  return`<div class="card" style="padding:0"><div class="tablewrap"><table><tr><th>Quando</th><th>Evento</th><th>Versão</th><th>Conta?</th><th class="n">Valor</th><th>click_id</th><th>Payload</th></tr>
  ${ev.map(x=>{const i=V.findIndex(v=>v.id===x.variant_id);const q=qualifies(m,x.payload);const val=m.value_field?Number(deepGet(x.payload,m.value_field))||0:0;return`<tr><td class="small">${fmtDT(x.created_at)}</td><td class="mono">${esc(x.event_type||'—')}</td><td>${x.attributed&&i>=0?`<span class="tag t${VCLASS(i)}">${LETTER(i)}</span> ${esc(V[i]?.name)}`:`<span class="badge pending">Não atribuído</span>`}</td><td>${q?'Sim':'<span class="muted">Não</span>'}</td><td class="n">${fmtR(val)}</td><td class="mono small">${esc(x.click_id||'—')}</td><td><details><summary class="small muted" style="cursor:pointer">ver</summary><pre class="mono small" style="margin-top:6px">${esc(JSON.stringify(x.payload,null,1))}</pre></details></td></tr>`;}).join('')}</table></div></div>`;}
function drawCharts(e,r){
  charts.forEach(c=>c.destroy());charts=[];if(typeof Chart==='undefined')return;
  const css=getComputedStyle(document.documentElement);const col=n=>css.getPropertyValue(n).trim();const V=e.variants;
  const colors=V.map((v,i)=>col('--'+VCLASS(i).toLowerCase()));Chart.defaults.color=col('--muted');Chart.defaults.borderColor=col('--line');Chart.defaults.font.family=css.getPropertyValue('--sans');
  const base={responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}};
  const {keys,days}=dailySeries(e);const labels=keys.map(k=>k.slice(8,10)+'/'+k.slice(5,7));const useSum=['sum','avg'].includes(e.metric.aggregation);
  const cum=fn=>V.map((v,i)=>{let acc=0;return{label:LETTER(i)+' '+v.name,data:keys.map(k=>acc+=fn(days[k][v.id])),borderColor:colors[i],backgroundColor:colors[i],tension:.2,pointRadius:2};});
  const mk=(id,cfg)=>{const c=document.getElementById(id);if(c)charts.push(new Chart(c,cfg));};
  mk('ch-dist',{type:'doughnut',data:{labels:V.map((v,i)=>LETTER(i)+' '+v.name),datasets:[{data:V.map(v=>r.per[v.id].visitors),backgroundColor:colors,borderWidth:0}]},options:{...base,cutout:'65%'}});
  mk('ch-vis',{type:'line',data:{labels,datasets:V.map((v,i)=>({label:LETTER(i)+' '+v.name,data:keys.map(k=>days[k][v.id].visitors),borderColor:colors[i],backgroundColor:colors[i],tension:.2,pointRadius:2}))},options:{...base,scales:{y:{beginAtZero:true}}}});
  mk('ch-res',{type:'line',data:{labels,datasets:cum(d=>useSum?d.sum:d.count)},options:{...base,scales:{y:{beginAtZero:true}}}});
  mk('ch-conv',{type:'bar',data:{labels:V.map((v,i)=>LETTER(i)+' '+v.name),datasets:[{label:'Conversão %',data:V.map(v=>+r.per[v.id].conv.toFixed(2)),backgroundColor:colors,borderRadius:4}]},options:{...base,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
  mk('ch-rev',{type:'line',data:{labels,datasets:cum(d=>d.sum)},options:{...base,scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$'+fmtN(v)}}}}});
}

/* ===================== ações ===================== */
async function setStatus(id,status,msg){const e=S.experiments.find(x=>x.id===id);const {error}=await sb.from('experiments').update({status}).eq('id',id);if(error)return fail(error);await hist(e,msg);await refreshExp(id);toast(msg);render();}
async function archiveExp(id,flag){const e=S.experiments.find(x=>x.id===id);const {error}=await sb.from('experiments').update({archived:flag}).eq('id',id);if(error)return fail(error);await hist(e,flag?'Teste arquivado':'Teste desarquivado');await refreshExp(id);toast(flag?'Teste arquivado':'Teste desarquivado');render();}
function pauseExp(id){setStatus(id,'paused','Teste pausado');}
function resumeExp(id){setStatus(id,'active','Teste retomado');}
function openFinish(id){const e=S.experiments.find(x=>x.id===id);const r=computeResults(e);
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Encerrar teste</h2>
  <div class="muted" style="margin:6px 0 14px">O split para. Qual versão continuará recebendo o tráfego? O link continua exatamente o mesmo e passa a enviar 100% para a escolhida.</div>
  ${e.variants.map((v,i)=>{const p=r.per[v.id];return`<button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px" onclick="finishExp('${e.id}','${v.id}')"><span class="tag t${VCLASS(i)}">${LETTER(i)}</span> <strong>${esc(v.name)}</strong><div class="muted small" style="margin-top:4px">${fmtN(p.visitors)} visitantes · ${fmtN(p.count)} eventos · conversão ${fmtP(p.conv)} · ${fmtR(p.sum)}</div></button>`;}).join('')}
  <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" onclick="closeModal()">Cancelar</button></div></div></div>`;}
function closeModal(){document.getElementById('modal').innerHTML='';}
async function resetMetrics(id){const e=S.experiments.find(x=>x.id===id);if(!confirm('Zerar todas as métricas de "'+e.name+'"? Visitantes, cliques e eventos serão apagados. Isso não tem volta.'))return;
  const {error}=await sb.rpc('reset_experiment_metrics',{p_experiment:id});if(error)return fail(error,'Não foi possível zerar');await refreshExp(id);toast('Métricas zeradas');render();}
async function deleteExp(id){const e=S.experiments.find(x=>x.id===id);if(!confirm('Excluir o teste "'+e.name+'" e todos os dados? O link deixa de funcionar.'))return;
  const {error}=await sb.from('experiments').delete().eq('id',id);if(error)return fail(error);await boot();go('#/testes');}
async function finishExp(id,vid){const e=S.experiments.find(x=>x.id===id);const v=e.variants.find(x=>x.id===vid);
  const patch={winning_variant_id:vid};if(e.status!=='finished'){patch.status='finished';patch.finished_at=iso(now());}
  const {error}=await sb.from('experiments').update(patch).eq('id',id);if(error)return fail(error);
  if(patch.status)await hist(e,'Teste encerrado manualmente');await hist(e,`Versão final escolhida: ${LETTER(e.variants.indexOf(v))} ${v.name} (100% do tráfego)`);
  closeModal();await refreshExp(id);toast('Teste encerrado');render();}
async function simWebhook(id){const e=S.experiments.find(x=>x.id===id);let p;try{p=JSON.parse(document.getElementById('wh-json').value);}catch(err){toast('JSON inválido.');return;}
  try{const r=await fetch(webhookUrl(e.webhook_token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));toast(j.attributed?'Evento recebido e atribuído a uma versão':'Evento recebido como não atribuído');}
  catch(err){fail(err,'Webhook não respondeu');}
  await refreshExp(id);render();}

(async()=>{
  if(!sb){render();return;}
  const {data}=await sb.auth.getSession();USER=data?.session?.user||null;
  sb.auth.onAuthStateChange((_ev,session)=>{const u=session?.user||null;if(!!u!==!!USER){USER=u;if(u)boot();else render();}});
  if(USER)await boot();else render();
})();
</script>
